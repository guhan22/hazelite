services:
  db:
    image: postgres:17-alpine
    container_name: hazelite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hazelite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hazelite
    ports:
      # Loopback only: the database is not reachable from other machines on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - hazelite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazelite -d hazelite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hazelite-pgdata:
